<text x="316" y="399" font-size="14" fill="#24292f" font-weight="400">Query Tool</text>
<text x="316" y="427" font-size="14" fill="#24292f" font-weight="400">Properties...</text>
<text x="560" y="250" font-size="14" fill="#24292f">Choisir « Restore... »</text>
<text x="560" y="276" font-size="13" fill="#57606a">sur la base VIDE que vous</text>
